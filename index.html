<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>BRIVO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#eef2f7;}

header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:white;
  align-items:center;
}

.logo{font-weight:bold;font-size:20px;color:#2563eb;}

.search{padding:10px;}
.search input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  border-radius:15px;
  padding:10px;
  text-align:center;
}

.price{color:gray;}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:10px;
  border-radius:10px;
  width:100%;
}

/* زرار السلة */
.go-cart{
  position:fixed;
  bottom:20px;
  left:20px;
  width:60px;
  height:60px;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:22px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<header>
  <div style="display:flex;gap:10px;align-items:center;">
    <a href="https://facebook.com" target="_blank">📘</a>
    <div class="logo">BRIVO</div>
  </div>
</header>

<div class="search">
  <input type="text" placeholder="ابحث..." onkeyup="search(this.value)">
</div>

<div class="products">

  <div class="card" data-name="أرز">
    <h3>أرز</h3>
    <p class="price">25 جنيه</p>
    <button onclick="addToCart('أرز',25)">أضف للسلة</button>
  </div>

  <div class="card" data-name="سكر">
    <h3>سكر</h3>
    <p class="price">30 جنيه</p>
    <button onclick="addToCart('سكر',30)">أضف للسلة</button>
  </div>

  <div class="card" data-name="مكرونة">
    <h3>مكرونة</h3>
    <p class="price">15 جنيه</p>
    <button onclick="addToCart('مكرونة',15)">أضف للسلة</button>
  </div>

  <div class="card" data-name="زيت">
    <h3>زيت</h3>
    <p class="price">50 جنيه</p>
    <button onclick="addToCart('زيت',50)">أضف للسلة</button>
  </div>

</div>

<div class="go-cart" onclick="goToCart()">🛒</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

/* إضافة منتج */
function addToCart(name,price){
  if(cart[name]){
    cart[name].qty++;
  }else{
    cart[name]={price:price,qty:1};
  }
  localStorage.setItem("cart",JSON.stringify(cart));
}

/* فتح السلة */
function goToCart(){
  window.location.href = "cart.html";
}

/* البحث */
function search(value){
  let cards=document.querySelectorAll(".card");
  value=value.toLowerCase();

  cards.forEach(c=>{
    let name=c.getAttribute("data-name");
    c.style.display = name.includes(value) ? "block":"none";
  });
}
</script>

</body>
</html>
